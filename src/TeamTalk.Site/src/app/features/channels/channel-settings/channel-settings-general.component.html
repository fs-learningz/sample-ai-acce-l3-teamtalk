@if (store.channel(); as channel) {
  <div class="flex max-w-xl flex-col gap-6">
    <section class="flex flex-col gap-3">
      <h2 class="font-semibold text-base-content">About this channel</h2>

      <dl class="grid grid-cols-[8rem_1fr] gap-x-4 gap-y-2 text-sm text-base-content">
        <dt class="text-base-content/60">Name</dt>
        <dd class="truncate">
          @if (channel.type === 'Private') {
            <i class="pi pi-lock mr-1 text-xs"></i>
          } @else {
            <span class="mr-1">#</span>
          }
          {{ channel.name }}
        </dd>

        <dt class="text-base-content/60">Type</dt>
        <dd>{{ channel.type }}</dd>

        <dt class="text-base-content/60">Created by</dt>
        <dd class="truncate">{{ channel.createdByDisplayName }}</dd>

        <dt class="text-base-content/60">Created on</dt>
        <dd>{{ channel.createdAtUtc | date: 'longDate' }}</dd>

        <dt class="text-base-content/60">Members</dt>
        <dd>{{ channel.memberCount }}</dd>
      </dl>
    </section>
  </div>
}
