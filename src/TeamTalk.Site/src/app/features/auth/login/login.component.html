<div class="flex min-h-screen items-center justify-center bg-base-200 px-4">
  <form
    class="shadow-depth flex w-full max-w-sm flex-col gap-4 rounded-box bg-base-100 p-8"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <h1 class="text-xl font-semibold text-base-content">Sign in to TeamTalk</h1>

    @if (errorMessage()) {
      <p class="text-sm text-error">{{ errorMessage() }}</p>
    }

    <label class="flex flex-col gap-1 text-sm text-base-content">
      Email
      <input pInputText type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="flex flex-col gap-1 text-sm text-base-content">
      Password
      <input pInputText type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <p-button
      type="submit"
      label="Sign in"
      [loading]="isSubmitting()"
      [disabled]="form.invalid"
      styleClass="w-full"
    />

    <p class="text-sm text-base-content">
      No account?
      <a routerLink="/register" class="underline">Register</a>
    </p>
  </form>
</div>
