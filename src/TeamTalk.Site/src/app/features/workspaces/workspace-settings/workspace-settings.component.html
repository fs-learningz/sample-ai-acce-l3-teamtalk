<div class="flex min-h-screen flex-col">
  <header class="flex items-center gap-3 border-b border-base-300 bg-base-100 px-4 py-3">
    <button
      type="button"
      class="flex cursor-pointer items-center gap-1 rounded-field px-2 py-1 text-sm text-base-content/70 hover:bg-base-200"
      (click)="backToWorkspace()"
    >
      <i class="pi pi-arrow-left"></i>
      Back to workspace
    </button>
    <h1 class="truncate text-lg font-semibold text-base-content">
      {{ store.workspace()?.name }} settings
    </h1>
  </header>

  @if (errorMessage()) {
    <p class="px-4 py-2 text-sm text-error">{{ errorMessage() }}</p>
  }

  <div class="flex flex-1">
    <aside class="flex w-56 flex-col gap-1 border-r border-base-300 bg-base-200 p-4">
      <a
        [routerLink]="['general']"
        routerLinkActive="bg-base-300 font-semibold"
        class="rounded-field px-3 py-2 text-base-content hover:bg-base-300"
      >
        General
      </a>
      <a
        [routerLink]="['members']"
        routerLinkActive="bg-base-300 font-semibold"
        class="rounded-field px-3 py-2 text-base-content hover:bg-base-300"
      >
        Members
      </a>
      <a
        [routerLink]="['danger']"
        routerLinkActive="bg-base-300 font-semibold"
        class="rounded-field px-3 py-2 text-error hover:bg-base-300"
      >
        Danger
      </a>
    </aside>

    <main class="flex-1 bg-base-100 p-6">
      <router-outlet />
    </main>
  </div>
</div>
