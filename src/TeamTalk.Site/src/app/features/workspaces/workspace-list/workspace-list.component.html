<div class="mx-auto max-w-2xl px-4 py-10">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-base-content">Your workspaces</h1>
    <div class="flex gap-2">
      <p-button label="Invitations" icon="pi pi-envelope" severity="secondary" (onClick)="openInvitations()" />
      <p-button label="New workspace" icon="pi pi-plus" (onClick)="openCreateDialog()" />
    </div>
  </div>

  @if (errorMessage()) {
    <p class="mb-4 text-sm text-error">{{ errorMessage() }}</p>
  }

  @if (workspaces().length === 0) {
    <p class="text-base-content">You don't belong to any workspace yet.</p>
  }

  <ul class="flex flex-col gap-2">
    @for (workspace of workspaces(); track workspace.id) {
      <li
        class="shadow-depth flex items-center justify-between rounded-box bg-base-100 p-4 hover:bg-base-200"
      >
        <button
          type="button"
          class="flex-1 text-left text-base-content"
          (click)="openWorkspace(workspace)"
        >
          {{ workspace.name }}
        </button>

        @if (isOwner(workspace)) {
          <button
            type="button"
            class="cursor-pointer text-base-content/60 hover:text-error"
            title="Delete workspace"
            (click)="deleteWorkspace(workspace)"
          >
            <i class="pi pi-trash"></i>
          </button>
        } @else {
          <button
            type="button"
            class="cursor-pointer text-base-content/60 hover:text-error"
            title="Leave workspace"
            (click)="leaveWorkspace(workspace)"
          >
            <i class="pi pi-sign-out"></i>
          </button>
        }
      </li>
    }
  </ul>
</div>

<p-confirmdialog [style]="{ width: '32rem' }" [breakpoints]="{ '768px': '90vw' }" />

<p-dialog
  header="Create workspace"
  [(visible)]="isCreateDialogVisible"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '768px': '90vw' }"
>
  <form class="flex flex-col gap-4" [formGroup]="createForm" (ngSubmit)="onCreateSubmit()">
    <label class="flex flex-col gap-1 text-sm text-base-content">
      Workspace name
      <input pInputText type="text" formControlName="name" />
    </label>
    <p-button type="submit" label="Create" [disabled]="createForm.invalid" />
  </form>
</p-dialog>
