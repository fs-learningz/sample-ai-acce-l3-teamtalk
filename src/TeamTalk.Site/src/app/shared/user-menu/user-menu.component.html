<button
  type="button"
  class="cursor-pointer rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
  aria-haspopup="true"
  [attr.aria-expanded]="isOpen()"
  aria-label="Account menu"
  (click)="toggle($event)"
>
  <app-user-avatar [name]="displayName()" [email]="email()" [presence]="presence()" />
</button>

<p-popover (onShow)="isOpen.set(true)" (onHide)="isOpen.set(false)">
  <div class="flex w-72 flex-col gap-3 p-1">
    <div class="flex items-center gap-3">
      <app-user-avatar [name]="displayName()" [email]="email()" [presence]="presence()" size="lg" />
      <div class="min-w-0">
        <p class="truncate font-semibold text-base-content">{{ displayName() }}</p>
        <p class="truncate text-sm text-base-content/60" [title]="email()">{{ email() }}</p>
      </div>
    </div>

    <div class="flex items-center gap-2 text-sm text-base-content">
      <span
        class="h-2.5 w-2.5 rounded-full"
        [class.bg-green-500]="presence() === 'online'"
        [class.bg-yellow-400]="presence() === 'away'"
        [class.bg-gray-400]="presence() === 'offline'"
      ></span>
      <span>{{ presenceLabel() }}</span>
    </div>

    <hr class="border-base-300" />

    <p-button
      label="Log out"
      icon="pi pi-sign-out"
      severity="secondary"
      styleClass="w-full"
      (onClick)="logout()"
    />
  </div>
</p-popover>
